name: PKGBUILD Tester

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yml'
      - 'action.yml'
      - 'entrypoint.sh'
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'action.yml'
      - 'entrypoint.sh'
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    name: Test Builds

    strategy:
      matrix:
        include:
          - pkg-name: av1an-git
            run: 'av1an --version'
          - pkg-name: zig-bin
          - pkg-name: vapoursynth-api3-headers
          - pkg-name: libdovi-git
          - pkg-name: libhdr10plus-rs-git
          - pkg-name: x265-git
            run: 'x265 -V'
          - pkg-name: x265-pmod-git
          - pkg-name: aom-psy101-git
          - pkg-name: aom-git
            run: 'aomenc --help'
          - pkg-name: llvm-bolt
          - pkg-name: onnxruntime-cpu
          - pkg-name: vapoursynth-plugin-mlrt-ort-cpu-runtime-git
          - pkg-name: zlib-ng-compat-git
      fail-fast: false

    steps:

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          path: action

      - uses: actions/checkout@v7
        with:
          repository: rokibhasansagar/Arch_PKGBUILDs
          ref: main
          path: Arch_PKGBUILDs

      - name: aom-git preparation
        if: ${{ matrix.pkg-name == 'aom-git' }}
        run: |
          cd Arch_PKGBUILDs/TEST/
          mv aom* ../
          cd ..

      - name: pkgbuild
        uses: ./action
        with:
          target: pkgbuild
          debug: true
          pkgname: Arch_PKGBUILDs/${{ matrix.pkg-name }}

      - name: srcinfo
        continue-on-error: true
        uses: ./action
        with:
          target: srcinfo
          pkgname: Arch_PKGBUILDs/${{ matrix.pkg-name }}

      - name: run
        if: ${{ matrix.run != '' }}
        continue-on-error: true
        uses: ./action
        with:
          target: run
          pkgname: Arch_PKGBUILDs/${{ matrix.pkg-name }}
          command: ${{ matrix.run }}

